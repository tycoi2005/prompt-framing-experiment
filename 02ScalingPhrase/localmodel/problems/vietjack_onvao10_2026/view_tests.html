<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VietJack On Vao 10 2026 - tests.jsonl</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [['\\[', '\\]']] },
      svg: { fontCache: 'global' },
      startup: { typeset: false }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #18202f;
      --muted: #637083;
      --line: #dde3ec;
      --accent: #156f8f;
      --accent-strong: #0d526b;
      --soft: #e9f5f8;
      --warn: #9b4f0f;
      --shadow: 0 10px 30px rgba(25, 37, 55, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(247, 248, 251, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .topbar {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }

    input[type="search"],
    input[type="file"],
    select,
    button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }

    input[type="search"] {
      width: 100%;
      padding: 0 12px;
    }

    input[type="file"] {
      max-width: 260px;
      padding: 8px;
      color: var(--muted);
    }

    button,
    select {
      padding: 0 12px;
      cursor: pointer;
    }

    button {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 650;
    }

    button:hover {
      background: var(--accent-strong);
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px 24px 48px;
    }

    .status {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .status strong {
      color: var(--text);
    }

    .notice {
      display: none;
      margin: 0 0 16px;
      padding: 12px 14px;
      border: 1px solid #e5c79d;
      border-radius: 8px;
      background: #fff8ed;
      color: var(--warn);
    }

    .exam {
      margin: 0 0 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .exam-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff 0%, #f8fbfc 100%);
    }

    .exam-title {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      white-space: nowrap;
    }

    .source-link {
      color: var(--accent-strong);
      font-size: 13px;
      text-decoration: none;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    .questions {
      padding: 0 18px 18px;
    }

    details.question {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    details.question[open] {
      border-color: #c9dce4;
    }

    summary {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
      cursor: pointer;
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .q-index {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--soft);
      color: var(--accent-strong);
      font-weight: 750;
    }

    .q-title {
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .q-type {
      color: var(--muted);
      font-size: 13px;
    }

    .q-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      padding: 0 14px 16px;
      border-top: 1px solid var(--line);
    }

    .section-title {
      margin: 14px 0 8px;
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .html-content {
      min-width: 0;
      overflow-x: auto;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .html-content img {
      max-width: 100%;
      height: auto;
    }

    .html-content table {
      max-width: 100%;
      border-collapse: collapse;
    }

    .html-content td,
    .html-content th {
      padding: 6px;
    }

    .empty {
      padding: 40px 20px;
      color: var(--muted);
      text-align: center;
    }

    mark {
      background: #fff0a8;
      color: inherit;
    }

    @media (max-width: 820px) {
      .controls {
        grid-template-columns: 1fr;
      }

      input[type="file"] {
        max-width: none;
        width: 100%;
      }

      .exam-header,
      .q-body {
        grid-template-columns: 1fr;
      }

      summary {
        grid-template-columns: auto 1fr;
      }

      .q-type {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <h1>VietJack On Vao 10 2026</h1>
      <div class="controls">
        <input id="search" type="search" placeholder="Tìm theo tiêu đề, nội dung, lời giải, URL...">
        <select id="sectionFilter" aria-label="Lọc theo section">
          <option value="">Tất cả section</option>
        </select>
        <input id="fileInput" type="file" accept=".jsonl,.txt,application/jsonlines">
      </div>
    </div>
  </header>

  <main>
    <p id="notice" class="notice"></p>
    <div id="status" class="status">Đang tải <strong>tests.jsonl</strong>...</div>
    <div id="app"></div>
  </main>

  <script>
    const state = {
      exams: [],
      query: '',
      section: ''
    };

    const app = document.getElementById('app');
    const statusEl = document.getElementById('status');
    const noticeEl = document.getElementById('notice');
    const searchEl = document.getElementById('search');
    const sectionFilterEl = document.getElementById('sectionFilter');
    const fileInputEl = document.getElementById('fileInput');

    function text(value) {
      return value == null ? '' : String(value);
    }

    function normalize(value) {
      return text(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function parseJsonl(raw) {
      return raw
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .map((line, index) => {
          try {
            return JSON.parse(line);
          } catch (error) {
            throw new Error(`Line ${index + 1}: ${error.message}`);
          }
        });
    }

    function escapeHtml(value) {
      return text(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function stripHtml(value) {
      const div = document.createElement('div');
      div.innerHTML = text(value);
      return div.textContent || div.innerText || '';
    }

    function excerpt(question) {
      const source = question.content_text || stripHtml(question.content_html);
      return text(source).replace(/\s+/g, ' ').trim().slice(0, 150);
    }

    function questionMatches(question, needle) {
      if (!needle) return true;
      return [
        question.slug,
        question.type,
        question.content_text,
        question.reason_text,
        stripHtml(question.content_html),
        stripHtml(question.reason_html)
      ].some(value => normalize(value).includes(needle));
    }

    function examMatches(exam, needle) {
      if (!needle) return true;
      return [
        exam.index,
        exam.section,
        exam.title,
        exam.page_title,
        exam.url,
        exam.exam_id
      ].some(value => normalize(value).includes(needle));
    }

    function filteredExams() {
      const needle = normalize(state.query);
      return state.exams
        .filter(exam => !state.section || exam.section === state.section)
        .map(exam => {
          const questions = Array.isArray(exam.questions) ? exam.questions : [];
          const matchedQuestions = questions.filter(question => questionMatches(question, needle));
          const includeAll = examMatches(exam, needle);
          return {
            exam,
            questions: includeAll ? questions : matchedQuestions
          };
        })
        .filter(item => item.questions.length || examMatches(item.exam, needle));
    }

    function updateSections() {
      const current = sectionFilterEl.value;
      const sections = [...new Set(state.exams.map(exam => exam.section).filter(Boolean))].sort();
      sectionFilterEl.innerHTML = '<option value="">Tất cả section</option>' +
        sections.map(section => `<option value="${escapeHtml(section)}">${escapeHtml(section)}</option>`).join('');
      sectionFilterEl.value = sections.includes(current) ? current : '';
    }

    function renderMath() {
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([app]).catch(() => {});
      }
    }

    function render() {
      const items = filteredExams();
      const questionCount = items.reduce((sum, item) => sum + item.questions.length, 0);
      statusEl.innerHTML = `Hiển thị <strong>${items.length}</strong> đề, <strong>${questionCount}</strong> câu hỏi từ <strong>${state.exams.length}</strong> dòng JSONL.`;

      if (!items.length) {
        app.innerHTML = '<div class="empty">Không có kết quả phù hợp.</div>';
        return;
      }

      app.innerHTML = items.map(({ exam, questions }) => {
        const declared = exam.total_questions_declared ? `${escapeHtml(exam.total_questions_declared)} khai báo` : 'không rõ';
        const url = exam.url ? `<a class="source-link" href="${escapeHtml(exam.url)}" target="_blank" rel="noreferrer">Nguồn</a>` : '';
        const title = exam.page_title || exam.title || `Exam ${exam.index || ''}`;
        return `
          <article class="exam">
            <div class="exam-header">
              <div>
                <h2 class="exam-title">${escapeHtml(title)}</h2>
                <div class="meta">
                  <span class="pill">Dòng ${escapeHtml(exam.index || '')}</span>
                  <span class="pill">${escapeHtml(exam.section || 'no-section')}</span>
                  <span class="pill">Exam ID ${escapeHtml(exam.exam_id || 'n/a')}</span>
                  <span class="pill">${questions.length} câu hiển thị / ${declared}</span>
                </div>
              </div>
              ${url}
            </div>
            <div class="questions">
              ${questions.map(question => renderQuestion(question)).join('')}
            </div>
          </article>
        `;
      }).join('');

      renderMath();
    }

    function renderQuestion(question) {
      const content = question.content_html || `<p>${escapeHtml(question.content_text || '')}</p>`;
      const reason = question.reason_html || `<p>${escapeHtml(question.reason_text || '')}</p>`;
      const hasReason = Boolean(question.reason_html || question.reason_text);
      return `
        <details class="question">
          <summary>
            <span class="q-index">${escapeHtml(question.index || '?')}</span>
            <span class="q-title">${escapeHtml(excerpt(question) || question.slug || 'Câu hỏi')}</span>
            <span class="q-type">${escapeHtml(question.type || '')}</span>
          </summary>
          <div class="q-body">
            <section>
              <div class="section-title">Đề bài</div>
              <div class="html-content">${content}</div>
            </section>
            <section>
              <div class="section-title">Lời giải</div>
              <div class="html-content">${hasReason ? reason : '<em>Không có lời giải.</em>'}</div>
            </section>
          </div>
        </details>
      `;
    }

    function setNotice(message) {
      noticeEl.textContent = message;
      noticeEl.style.display = message ? 'block' : 'none';
    }

    function loadRaw(raw, sourceName) {
      state.exams = parseJsonl(raw);
      state.query = searchEl.value;
      updateSections();
      setNotice('');
      render();
      document.title = `${sourceName} - ${state.exams.length} exams`;
    }

    async function loadDefault() {
      try {
        const response = await fetch('tests.jsonl', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`${response.status} ${response.statusText}`);
        }
        loadRaw(await response.text(), 'tests.jsonl');
      } catch (error) {
        statusEl.innerHTML = 'Không thể tự tải <strong>tests.jsonl</strong>.';
        setNotice('Nếu bạn mở HTML trực tiếp bằng file://, hãy chọn tests.jsonl bằng nút chọn file ở trên, hoặc chạy một web server trong thư mục này.');
      }
    }

    searchEl.addEventListener('input', event => {
      state.query = event.target.value;
      render();
    });

    sectionFilterEl.addEventListener('change', event => {
      state.section = event.target.value;
      render();
    });

    fileInputEl.addEventListener('change', async event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        loadRaw(await file.text(), file.name);
      } catch (error) {
        setNotice(`Không đọc được file: ${error.message}`);
      }
    });

    loadDefault();
  </script>
</body>
</html>
